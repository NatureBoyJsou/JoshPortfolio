  .pulse-glow {
    color: #0ff;
    font-weight: bold;
    font-size: 2rem;

  @keyframes pulse {
    0%, 100% {

    }

      0 0 20px #ff007f,

      0 0 50px #00fff7,
      0 0 60px #ff007f;
    animation: cyberpunkFlicker 5s infinite alternate;
  }

  @keyframes cyberpunkFlicker {
    0%, 100% {
      text-shadow:
        0 0 5px #ff007f,
        0 0 10px #ff007f,
        0 0 20px #ff007f,
        0 0 30px #00fff7,
        0 0 40px #00fff7,
        0 0 50px #00fff7,
        0 0 60px #ff007f;
      opacity: 1;
    }
    50% {
      text-shadow:
        0 0 2px #ff007f,
        0 0 5px #ff007f,
        0 0 10px #ff007f,
        0 0 15px #00fff7,
        0 0 20px #00fff7,
        0 0 25px #00fff7,

      <script>
  const slides = document.querySelectorAll('.slide');
  const typewriterTextEl = document.querySelector('.hero-overlay .typewriter-text');

  // Placeholder texts for each slide index (0-based)
  const texts = [
    "Portfolio",
    "DOD Simulations Officer",
    "Software & Web Developer",
    "Independent Game Developer",
    "Fluent in Wide Variety of Programming Languages",
    "Extensive Cybersecurity & Network Experience"
  ];

  const TRANSITION_MS = 700;
  const TYPE_SPEED_MS = 80;

  let currentSlide = 0;
  let previousSlide = slides[0];
  let typingIndex = 0;
  let typingInterval;
  let autoAdvanceTimeout;
  let typingStartTimeout;
  let slideToken = 0;
  const paginationItems = Array.from(document.querySelectorAll('.pagination .pagination__item'));

  function scheduleAutoAdvance(fromIndex) {
    clearTimeout(autoAdvanceTimeout);
    autoAdvanceTimeout = setTimeout(() => {
      if (fromIndex !== currentSlide) return;
      const nextIndex = (currentSlide + 1) % slides.length;
      if (paginationItems[nextIndex]) {
        paginationItems[nextIndex].click();
      }
    }, 3000);
  }

  function typeWriter(text, element, onDone) {
    if (!element) return;
    clearInterval(typingInterval);
    element.textContent = '';
    typingIndex = 0;

    typingInterval = setInterval(() => {
      if (typingIndex < text.length) {
        element.textContent += text.charAt(typingIndex);
        typingIndex++;
      } else {
        clearInterval(typingInterval);
        if (typeof onDone === 'function') onDone();
      }
    }, TYPE_SPEED_MS);
  }

  function startTypingForSlide(idx, token) {
    clearTimeout(typingStartTimeout);
    clearInterval(typingInterval);
    typingStartTimeout = setTimeout(() => {
      if (token !== slideToken) return;
      typeWriter(texts[idx], typewriterTextEl, () => scheduleAutoAdvance(idx));
    }, TRANSITION_MS + 50);
  }

  function checkSlide() {
    slides.forEach((slide, idx) => {
      if (!slide.classList.contains('slide--current')) return;
      if (currentSlide === idx) return;

      if (previousSlide && previousSlide !== slide) {
        previousSlide.classList.add('is-exiting');
        setTimeout(() => {
          previousSlide.classList.remove('is-exiting');
        }, TRANSITION_MS);
      }

      currentSlide = idx;
      previousSlide = slide;
      slideToken += 1;
      startTypingForSlide(currentSlide, slideToken);
    });
  }

  // Initialize with first slide's text
  typeWriter(texts[0], typewriterTextEl, () => scheduleAutoAdvance(0));

  // Run check frequently to catch slide changes, typing starts after fade completes
  setInterval(checkSlide, 150);
</script>
